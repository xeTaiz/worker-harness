upstream wh_orchestrator {
    server wh-orch:12889;
    keepalive 16;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /sw.js {
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache" always;
        try_files /sw.js =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files /manifest.webmanifest =404;
    }

    # The browser terminal gateway requires an HTTP/1.1 upgrade and must not
    # buffer PTY traffic.
    location ~ ^/api/v1/pi/sessions/[^/]+/attach-gateway$ {
        proxy_pass http://wh_orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        # Nginx requires finite proxy timeouts. Keep this effectively unbounded;
        # relay capacity replacement, not inactivity, owns attachment lifetime.
        proxy_read_timeout 365d;
        proxy_send_timeout 365d;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The orchestrator sends an SSE heartbeat every 15 seconds. Disable proxy
    # buffering and keep the upstream connection open well beyond that window.
    location ~ ^/api/v1/pi/sessions/[^/]+/stream$ {
        proxy_pass http://wh_orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering "no" always;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Global semantic router controls, dispatch, snapshot, and request status.
    location ~ ^/api/v1/pi/router(?::dispatch|/(?:config|models|snapshot|requests/[^/]+))$ {
        proxy_pass http://wh_orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Preserve the existing same-origin session UI without exposing unrelated
    # worker, job, tunnel, data, bridge, delegation, metrics, or admin APIs.
    location ~ ^/api/v1/pi/sessions(?:$|/) {
        proxy_pass http://wh_orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        access_log off;
        default_type text/plain;
        return 404 "not handled by wh-web\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }
}
