map $http_upgrade $wh_connection_upgrade {
    default upgrade;
    '' close;
}

upstream wh_orchestrator {
    server wh-orch:12889;
    keepalive 16;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /sw.js {
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache" always;
        try_files /sw.js =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files /manifest.webmanifest =404;
    }

    # Native notebook HTTP, SSE and WebSocket traffic stays inside the owned
    # proxy prefix. The backend authenticates every request and upgrade.
    location ~ ^/api/v1/marimo/[^/]+/proxy(/|$) {
        access_log off;
        proxy_pass http://wh_orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wh_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 365d;
        proxy_send_timeout 365d;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
    }

    # Bootstrap-only Pi terminal authorization remains in the backend.
    location ~ ^/api/v1/pi/sessions/[^/]+/attach-gateway$ {
        access_log off;
        proxy_pass http://wh_orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wh_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 365d;
        proxy_send_timeout 365d;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Pi SSE and owned job logs must arrive incrementally, not in proxy batches.
    location ~ ^/api/v1/(?:pi/sessions/[^/]+/stream|jobs/[^/]+/logs/stream)$ {
        access_log off;
        proxy_pass http://wh_orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
    }

    # Worker/data views are read-only sanitized DTOs; worker administration is
    # intentionally not reachable through this edge.
    location ~ ^/api/v1/workers(?:$|/[^/]+$) {
        if ($request_method != GET) { return 404; }
        access_log off;
        proxy_pass http://wh_orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location = /api/v1/data {
        if ($request_method != GET) { return 404; }
        access_log off;
        proxy_pass http://wh_orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Explicit capability families only. No edge-injected identity or CORS:
    # browser cookies, bearer keys, Origin and CSRF headers pass through unchanged.
    location ~ ^/api/v1/(?:auth/|admin/|jobs(?:$|/)|usage$|tunnels(?:$|/)|marimo(?:$|/)|pi/) {
        access_log off;
        proxy_pass http://wh_orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # First Pi launch can wait up to 60 seconds for its bridge.
        proxy_read_timeout 90s;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 404 "not handled by wh-web\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
