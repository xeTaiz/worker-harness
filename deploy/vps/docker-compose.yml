# Multi-user Worker Harness control plane behind SWAG (Docker network `proxy`).
#
#   Internet --HTTPS--> SWAG (worker-harness.subdomain.conf)
#                         --> worker-harness-web:8080 (UI + API allowlist)
#                               --> worker-harness-orch:12889 (internal network only)
#   wh-hs tailnet --> worker-harness-orch tailscaled (TUN): workers register on
#                     :12888; the orchestrator reaches workers with `tailscale ssh`.
#
# Layout (copy this file to /docker/worker-harness-mu/compose.yml):
#   /docker/worker-harness-mu/
#     compose.yml
#     orchestrator.env      from deploy/vps/orchestrator.env.example, chmod 600
#     volumes/tailscale/    tailnet identity            (chmod 700)
#     volumes/registry/     SQLite DB                   (chmod 700)
#     worker-harness/       git checkout, build context
#
#   docker compose up -d --build
#   docker compose exec -it worker-harness-orch \
#     python -m worker_harness.orchestrator bootstrap-admin --username admin
name: worker-harness

services:
  worker-harness-orch:
    build:
      context: ./worker-harness
      dockerfile: orchestrator_container/Dockerfile
    image: worker-harness-orch:multi-user
    container_name: worker-harness-orch
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - orchestrator.env
    environment:
      # The API listens only on the internal network, never on the container's
      # tailnet address: browsers and the extension go through the web edge.
      WH_CONTROL_HOST: 172.31.250.10
      WH_CONTROL_PORT: "12889"
      # Registration is reached by workers over the tailnet (never published).
      WH_HB_HOST: 0.0.0.0
      WH_HB_PORT: "12888"
      # Proxies whose X-Forwarded-For hop is trusted for login rate limiting:
      # worker-harness-web and the whole `proxy` network (SWAG). Replace
      # PROXY_SUBNET with: docker network inspect proxy -f '{{(index .IPAM.Config 0).Subnet}}'
      # The orchestrator refuses to start until it is a valid CIDR.
      WH_TRUSTED_PROXIES: 172.31.250.11/32,PROXY_SUBNET
    volumes:
      - ./volumes/tailscale:/var/lib/tailscale
      - ./volumes/registry:/root/.config/worker-harness
    networks:
      internal:
        ipv4_address: 172.31.250.10
        aliases:
          - wh-orch

  worker-harness-web:
    build:
      context: ./worker-harness
      dockerfile: web_container/Dockerfile
    image: worker-harness-web:multi-user
    container_name: worker-harness-web
    restart: unless-stopped
    depends_on:
      - worker-harness-orch
    # Not published on the host; SWAG reaches it on the `proxy` network.
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
    networks:
      internal:
        ipv4_address: 172.31.250.11
      proxy: {}

networks:
  internal:
    ipam:
      config:
        # Must not overlap an existing Docker network on the host.
        - subnet: 172.31.250.0/24
  proxy:
    external: true
