## Worker Harness (multi-user) — SWAG proxy conf.
## Copy to /config/nginx/proxy-confs/ and restart SWAG. The SWAG certificate
## must cover worker-harness.d0me.xyz (e.g. a *.d0me.xyz wildcard or
## EXTRA_DOMAINS / SUBDOMAINS).
##
## No Authelia/Authentik/LDAP here: the harness authenticates itself, and the
## Pi extension calls the API with bearer API keys that a forward-auth login
## would block. worker-harness-web enforces the API path allowlist.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name worker-harness.d0me.xyz;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        # proxy.conf passes Upgrade/Connection (WebSockets) and appends the
        # client address to X-Forwarded-For for the login rate limit.
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app worker-harness-web;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
        # Job-log/Pi-event SSE and Marimo streams must not be buffered.
        proxy_buffering off;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    }
}
